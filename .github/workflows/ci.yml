# CI for kevbot.
#
# Runs on every PR and on pushes to main. Three gates, in the order they
# fail cheapest-first:
#   1. install  — npm ci is the slow part; fail fast on a broken lockfile
#   2. typecheck — tsc --noEmit, the real diagnostic source for this repo
#   3. build     — the same compile the Dockerfile runs, via npm run build
#   4. docker    — proves the image still builds, which catches breakage that
#                  a bare tsc run cannot (COPY paths, .dockerignore drift)
#
# Node is pinned to 22 because the Dockerfile builds on node:22-alpine. A CI
# green on a different major than production ships is a lie, so keep these in sync.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch cancels the in-flight run. On a PR this keeps
# the check tied to the latest commit instead of letting stale runs pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build, and image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # tsconfig.json excludes tests, so the suite is transpiled but never
      # typechecked by the step above. A wrong helper signature or a stale
      # assertion type would otherwise only surface as a runtime failure.
      - name: Typecheck tests
        run: npx tsc -p tsconfig.tests.json

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build Docker image
        run: docker build -t kevbot:ci .

      # The runtime image is alpine (musl) on Node 22. node:sqlite is built into
      # Node from 22.13, but it is a platform-specific native module, so prove
      # it actually loads in the image that ships instead of only on the Ubuntu
      # CI runner. This catches a base image that quietly predates SQLite.
      - name: Verify node:sqlite in the runtime image
        run: docker run --rm kevbot:ci node -e "require('node:sqlite')"

      # Smoke-test the image without a Discord token: it must start, then fail
      # cleanly on the missing DISCORD_TOKEN rather than crash on a bad import
      # or a missing data/ file. A non-zero exit is the EXPECTED outcome here,
      # so we assert on the shape of the failure, not on the exit code.
      - name: Smoke-test image starts and fails only on the missing token
        run: |
          set +e
          output=$(timeout 20 docker run --rm -e DISCORD_TOKEN= kevbot:ci 2>&1)
          code=$?
          set -e
          echo "$output"

          # 124 = still running at the timeout, i.e. it got past startup and
          # was sitting in the gateway connect loop. That is a pass.
          if [ "$code" = "124" ]; then
            echo "Image stayed up for 20s with no token; startup is sound."
            exit 0
          fi

          # Anything else must be the token error specifically. A module-load or
          # ENOENT failure here is a real regression.
          if echo "$output" | grep -qi "DISCORD_TOKEN"; then
            echo "Failed exactly as expected: no token configured."
            exit 0
          fi

          echo "::error::Image failed for an unexpected reason (exit $code)."
          exit 1

  # The Terraform in deploy/tf creates the OCI Logging destination. Nothing
  # else in CI touches it, and an invalid resource type or argument only shows
  # up at `terraform plan` — against a real tenancy. `validate` catches schema
  # mistakes, missing required arguments, and bad variable references without
  # needing credentials or state.
  terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: deploy/tf

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          # The wrapper's output parsing breaks `validate`'s exit codes.
          terraform_wrapper: false

      # No backend and no state: validate only needs the provider schema.
      - name: Init
        run: terraform init -backend=false -input=false -no-color

      - name: Validate
        run: terraform validate -no-color

  # The two shell scripts are the parts most likely to be debugged on the VM at
  # an inconvenient hour, and nothing else exercises them: setup-vm.sh needs a
  # VM and check-agent.sh needs instance metadata. ShellCheck is static, so it
  # runs on every PR. It ships on the GitHub-hosted Ubuntu image; the install is
  # a fallback for the day that changes.
  scripts:
    name: Lint shell scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
          }
          shellcheck --version
          shellcheck -S warning deploy/setup-vm.sh deploy/oci-logging/check-agent.sh
